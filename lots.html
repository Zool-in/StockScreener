<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F&O Lot Sizes - StockScan Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css?v=6">
  <link rel="stylesheet" href="css/components.css?v=6">
  <style>
    .table-container {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 24px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    th {
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(0,0,0,0.2);
      cursor: pointer;
      user-select: none;
    }
    th:hover {
      color: var(--text-primary);
    }
    .sort-icon {
      margin-left: 4px;
      font-size: 12px;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .sym-name {
      font-family: var(--mono);
      font-weight: 600;
      color: var(--text-primary);
    }
    .numeric {
      font-family: var(--mono);
      text-align: right;
    }
    th.numeric {
      text-align: right;
    }
    .search-bar {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      background: var(--bg-body);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
    }
    .search-bar:focus {
      outline: none;
      border-color: var(--brand);
    }
    
    .loading-state {
      padding: 64px 0;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Global HUD -->
  <header class="hud-bar">
    <div class="logo"><a href="index.html" class="hud-brand" style="text-decoration: none;">StockScan Pro</a></div>
    
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>

    <div class="hud-nav-container">
      <div class="hud-menu">
        <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">Stock Screener</a>
        <a href="options.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">Options (Gamma)</a>
        <a href="multi-tf.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">Multi-TF Scanner</a>
        <a href="index.html#tabScripts" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">Scripts</a>
      </div>
      <div class="hud-stats">
        <div class="badge badge-amber">F&O Live Lots</div>
      </div>
    </div>
  </header>

  <main class="app-container">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px;">
      <div>
        <h1 style="font-size: 24px; font-weight: 600; margin: 0 0 8px 0;">Live F&O Lot Sizes</h1>
        <p style="color: var(--text-muted); margin: 0;">Official lot sizes fetched directly from exchange endpoints, updated daily. Values reflect real-time prices.</p>
      </div>
    </div>
    
    <div class="card" style="margin-top: 24px;">
      <input type="text" id="searchInput" class="search-bar" placeholder="Search symbol...">
      
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th data-sort="symbol">Symbol <span class="sort-icon"></span></th>
              <th data-sort="price" class="numeric">Live Price (₹) <span class="sort-icon"></span></th>
              <th data-sort="lot" class="numeric">Lot Size <span class="sort-icon"></span></th>
              <th data-sort="value" class="numeric">Contract Value (₹) <span class="sort-icon"></span></th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="4" class="loading-state" id="loadingText">Fetching live lots and quotes...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const fmt = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 2, minimumFractionDigits: 2 });
    const fmtWhole = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
    
    let rawData = [];
    let currentSort = { col: 'value', asc: false };

    async function init() {
      try {
        // 1. Fetch Lots
        const lotRes = await fetch('/api/lots');
        const lotJson = await lotRes.json();
        const lots = lotJson.lots || {};
        const symbols = Object.keys(lots);
        
        if (symbols.length === 0) {
          document.getElementById('loadingText').innerText = 'No F&O lots found.';
          return;
        }

        document.getElementById('loadingText').innerText = `Fetching quotes for ${symbols.length} symbols in chunks...`;

        // 2. Fetch Quotes (chunked to avoid server timeout on Google scraper fallback)
        let allQuotes = {};
        const CHUNK_SIZE = 15;
        for (let i = 0; i < symbols.length; i += CHUNK_SIZE) {
          const chunk = symbols.slice(i, i + CHUNK_SIZE);
          try {
            const quoteRes = await fetch(`/api/quotes?symbols=${encodeURIComponent(chunk.join(','))}`);
            const quoteJson = await quoteRes.json();
            if (quoteJson.quotes) {
              Object.assign(allQuotes, quoteJson.quotes);
            }
          } catch (e) {
            console.error('Chunk failed', e);
          }
        }
        
        // 3. Assemble Data
        rawData = symbols.map(sym => {
          const price = allQuotes[sym] || 0;
          const lot = lots[sym];
          return {
            symbol: sym,
            price: price,
            lot: lot,
            value: price * lot
          };
        });

        // 4. Initial Render
        renderTable();
        
      } catch (err) {
        console.error(err);
        document.getElementById('loadingText').innerText = 'Error loading data: ' + err.message;
      }
    }

    function renderTable() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      
      // Filter
      let viewData = rawData.filter(d => d.symbol.toLowerCase().includes(q));
      
      // Sort
      viewData.sort((a, b) => {
        let valA = a[currentSort.col];
        let valB = b[currentSort.col];
        if (typeof valA === 'string') {
          return currentSort.asc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        }
        return currentSort.asc ? (valA - valB) : (valB - valA);
      });

      // Update DOM
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = viewData.map(d => `
        <tr>
          <td class="sym-name">
            <a href="https://in.tradingview.com/chart/?symbol=NSE%3A${d.symbol}" target="_blank" style="color: inherit; text-decoration: none; border-bottom: 1px dashed var(--border);">
              ${d.symbol}
            </a>
          </td>
          <td class="numeric">${d.price > 0 ? fmt.format(d.price) : '—'}</td>
          <td class="numeric">${fmtWhole.format(d.lot)}</td>
          <td class="numeric" style="color: ${d.value > 1000000 ? 'var(--brand)' : 'inherit'}">${d.value > 0 ? fmtWhole.format(d.value) : '—'}</td>
        </tr>
      `).join('');
      
      if (viewData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="loading-state">No matching symbols found.</td></tr>`;
      }
      
      // Update Sort Icons
      document.querySelectorAll('th').forEach(th => {
        const icon = th.querySelector('.sort-icon');
        if (!icon) return;
        if (th.dataset.sort === currentSort.col) {
          icon.innerHTML = currentSort.asc ? '&#9650;' : '&#9660;';
        } else {
          icon.innerHTML = '';
        }
      });
    }

    // Events
    document.getElementById('searchInput').addEventListener('input', renderTable);
    
    document.querySelectorAll('th').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.sort;
        if (currentSort.col === col) {
          currentSort.asc = !currentSort.asc;
        } else {
          currentSort.col = col;
          currentSort.asc = (col === 'symbol'); // Default to ASC for strings, DESC for numbers
        }
        renderTable();
      });
    });

    init();
  </script>
</body>
</html>
