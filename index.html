<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockScan Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <!-- Global HUD -->
  <header class="hud-bar">
    <div class="hud-brand">StockScan Pro</div>
    <div class="hud-stats">
      <div id="mmiStatus" class="badge badge-muted">Market: Loading...</div>
      <div id="connStatus" class="badge badge-muted">Brokers: Offline</div>
    </div>
  </header>

  <main class="app-container">
    
    <!-- Command Bar -->
    <div class="card command-bar">
      
      <div class="input-group">
        <label class="input-label">Tickers (Comma separated, or paste list)</label>
        <input type="text" id="tickerInput" class="input" placeholder="RELIANCE, INFY.BO, TCS" value="RELIANCE, INFY, TCS, HDFCBANK, ICICIBANK">
      </div>

      <div class="input-group">
        <label class="input-label">Strategy</label>
        <select id="strategySelect" class="select">
          <optgroup label="Intraday (15m)">
            <option value="ttm_orb">TTM Squeeze + ORB</option>
          </optgroup>
          <optgroup label="Short Term (Daily)">
            <option value="btst">BTST Momentum</option>
            <option value="crsi">Connors RSI Mean Reversion</option>
          </optgroup>
          <optgroup label="Swing (Daily/Weekly)">
            <option value="minervini">Minervini Trend Template</option>
            <option value="darvas">Darvas Box Breakout</option>
            <option value="rs">Relative Strength Leader</option>
          </optgroup>
          <optgroup label="Short Setups">
            <option value="vcp_down">VCP Breakdown</option>
            <option value="bear_call">Bear Call Spreads</option>
          </optgroup>
          <optgroup label="Options Premium">
            <option value="bps">Bull Put Spread</option>
            <option value="strangle">Short Strangle</option>
            <option value="iv_crush">Earnings IV Crush Condor</option>
            <option value="wheel">The Wheel / Covered Call</option>
            <option value="csp">Standalone Cash Secured Put</option>
          </optgroup>
          <optgroup label="Long Term (Weekly/Monthly)">
            <option value="weinstein">Stan Weinstein Stage 2</option>
            <option value="wyckoff">Wyckoff Stopping Volume</option>
          </optgroup>
        </select>
      </div>

      <div class="input-group">
        <label class="input-label">Timeframe</label>
        <select id="timeframeSelect" class="select">
          <option value="15m">15 Min</option>
          <option value="1h">1 Hour</option>
          <option value="1d" selected>1 Day</option>
          <option value="1wk">1 Week</option>
        </select>
      </div>

      <div class="input-group">
        <label class="input-label">Capital (₹)</label>
        <input type="number" id="capitalInput" class="input" value="100000" step="10000">
      </div>

      <button id="scanBtn" class="btn">
        <span>Run Scan</span>
      </button>

    </div>

    <!-- Scanner Results Area -->
    <div id="resultsArea" class="results-grid">
      <!-- Cards will be injected here via JS -->
      <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 64px 0;">
        Ready. Select a strategy and hit Run Scan.
      </div>
    </div>

  </main>

  <!-- Entry point for UI routing and execution -->
  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
