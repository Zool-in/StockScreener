<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Options Gamma Screener</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css?v=7">
  <link rel="stylesheet" href="css/components.css?v=6">
  <style>
    .options-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .options-table th, .options-table td { padding: 12px; text-align: right; border-bottom: 1px solid var(--border-color); }
    .options-table th { background: var(--bg-surface); color: var(--text-muted); font-weight: 500; font-size: 13px; }
    .options-table th:first-child, .options-table td:first-child { text-align: left; }
    .options-table td { font-variant-numeric: tabular-nums; }
    /* Remove the overpowering background tint for the alert */
    .gamma-alert td:last-child { background: rgba(239, 68, 68, 0.15) !important; border-left: 2px solid var(--red); }
    
    .call-side { color: var(--text-green); }
    .put-side { color: var(--text-red); }
    
    .itm-bg { background: rgba(255, 215, 0, 0.12) !important; } /* Faint gold for In-The-Money */
    .otm-bg { background: transparent; } /* Clear for OTM */
    
    .atm-row { border-top: 2px solid var(--border-color); border-bottom: 2px solid var(--border-color); }
    .atm-row td { background: rgba(255, 255, 255, 0.08); border-top: 1px solid var(--text-muted); border-bottom: 1px solid var(--text-muted); }
    
    .oi-cell { position: relative; }
    .oi-bar { position: absolute; top: 0; bottom: 0; opacity: 0.2; pointer-events: none; }
    .oi-bar-call { right: 0; background: var(--red); }
    .oi-bar-put { left: 0; background: var(--green); }
    .strike-cell { text-align: center !important; font-weight: bold; background: var(--bg-card); font-size: 14px; }
  </style>
</head>
<body>

  <!-- Global HUD -->
  <header class="hud-bar">
    <div class="logo"><a href="index.html" class="hud-brand" style="text-decoration: none;">StockScan Pro</a></div>
    
    <input type="checkbox" id="nav-toggle" class="nav-toggle" style="display: none;">
    <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>

    <div class="hud-nav-container">
      <div class="hud-menu">
        <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">Stock Screener</a>
        <a href="options.html" style="color: var(--text-main); font-weight: 500; text-decoration: none;">Options (Gamma)</a>
        <a href="index.html#tabScripts" style="color: var(--text-muted); text-decoration: none; font-size: 14px;">Scripts</a>
      </div>
      <div class="hud-stats">
        <div id="connStatus" class="badge badge-muted">Brokers: Offline</div>
      </div>
    </div>
  </header>

  <main class="app-container">
    
    <!-- Filter Panel -->
    <div class="card" style="margin-bottom: 32px;">
      
      <div class="filter-group">
        <h2 class="filter-heading">Gamma Squeeze Screener</h2>
        <div class="input-group">
          <label class="input-label">Select Asset</label>
          <div class="pill-container" id="indexPills" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
            <button class="pill active" data-val="NSE:NIFTY50-INDEX">Nifty 50</button>
            <button class="pill" data-val="BSE:SENSEX-INDEX">Sensex</button>
            <button class="pill" data-val="NSE:NIFTYBANK-INDEX">Bank Nifty</button>
            <button class="pill" data-val="NSE:FINNIFTY-INDEX">Fin Nifty</button>
            
            <select id="stockSelect" style="margin-left: 10px; background: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 4px; padding: 6px 12px; outline: none; cursor: pointer; font-size: 13px;">
              <option value="">-- Nifty 50 Stocks --</option>
              <option value="NSE:RELIANCE-EQ">RELIANCE</option>
              <option value="NSE:HDFCBANK-EQ">HDFCBANK</option>
              <option value="NSE:ICICIBANK-EQ">ICICIBANK</option>
              <option value="NSE:INFY-EQ">INFY</option>
              <option value="NSE:TCS-EQ">TCS</option>
              <option value="NSE:ITC-EQ">ITC</option>
              <option value="NSE:LT-EQ">L&T</option>
              <option value="NSE:SBIN-EQ">SBIN</option>
              <option value="NSE:BHARTIARTL-EQ">BHARTIARTL</option>
              <option value="NSE:KOTAKBANK-EQ">KOTAKBANK</option>
            </select>
          </div>
        </div>

        <div class="input-group">
          <label class="input-label">Select Expiry</label>
          <div class="pill-container" id="expiryPills" style="display: flex; gap: 8px; flex-wrap: wrap;">
            <!-- Rendered dynamically -->
          </div>
          <p style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Nearest expiry is auto-selected for 0-DTE Gamma blasts.</p>
        </div>
      </div>
      
      <div class="actions">
        <button class="btn btn-primary" id="scanBtn" style="width: 100%;">Detect Gamma Spikes</button>
      </div>
      
    </div>

    <!-- Results Panel -->
    <div class="card">
      <div class="results-header">
        <h2>Live Option Chain</h2>
        <span class="status-indicator" id="scanStatus">Ready</span>
      </div>
      
      <div id="resultsGrid" style="overflow-x: auto;">
        <table class="options-table" id="optionsTable">
          <thead>
            <tr>
              <th style="font-size:11px; color:var(--text-muted)">IV</th>
              <th style="font-size:11px; color:var(--text-muted)">Theta</th>
              <th style="font-size:11px; color:var(--text-muted)">Gamma</th>
              <th>Delta</th>
              <th>Call LTP</th>
              <th>Call OI <div style="display:inline-block; width:12px; height:6px; background:var(--red); border-radius:2px; margin-left:4px;"></div></th>
              <th style="text-align:center;">Strike</th>
              <th>Put OI <div style="display:inline-block; width:12px; height:6px; background:var(--green); border-radius:2px; margin-left:4px;"></div></th>
              <th>Put LTP</th>
              <th>Delta</th>
              <th style="font-size:11px; color:var(--text-muted)">Gamma</th>
              <th style="font-size:11px; color:var(--text-muted)">Theta</th>
              <th style="font-size:11px; color:var(--text-muted)">IV</th>
              <th>Alert</th>
            </tr>
          </thead>
          <tbody id="optionsBody">
            <!-- Results injected here -->
          </tbody>
        </table>
      </div>
      
    </div>
  </main>

  <script type="module" src="js/ui/options_app.js?v=21" defer></script>
</body>
</html>
